<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friend Requests | ConnecFriend</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <div id="navbar"></div>

  <div class="container py-4">
    <div class="card border-0 shadow-sm rounded-3">
    <div class="card-header bg-white">
    <ul class="nav nav-underline" role="tablist" id="peopleTabs">
      <li class="nav-item" role="presentation"><button class="nav-link link-success active" data-bs-toggle="tab" data-bs-target="#find" data-hash="find" type="button" role="tab">Find People</button></li>
      <li class="nav-item" role="presentation"><button class="nav-link link-success" data-bs-toggle="tab" data-bs-target="#requests" data-hash="requests" type="button" role="tab">Requests <span class="badge rounded-pill text-bg-danger" id="reqCount">0</span></button></li>
      <li class="nav-item" role="presentation"><button class="nav-link link-success" data-bs-toggle="tab" data-bs-target="#sent" data-hash="sent" type="button" role="tab">Sent <span class="badge text-bg-light" id="sentCount">0</span></button></li>
      <li class="nav-item" role="presentation"><button class="nav-link link-success" data-bs-toggle="tab" data-bs-target="#ignored" data-hash="ignored" type="button" role="tab">Ignore List <span class="badge text-bg-light" id="ignCount">0</span></button></li>
    </ul>
    </div>

    <div class="card-body tab-content">
      <section class="tab-pane fade show active" id="find" role="tabpanel">
        <div class="row g-2 mb-3">
          <div class="col-md-6"><input type="search" class="form-control bg-body-tertiary border-0" id="peopleSearch" placeholder="Search by name, username or city" aria-label="Search people"></div>
          <div class="col-md-3">
            <select class="form-select bg-body-tertiary border-0" id="peopleFilter" aria-label="Show">
              <option value="others">Not friends yet</option>
              <option value="all">All members</option>
            </select>
          </div>
        </div>
        <div class="list-group list-group-flush" id="peopleGrid"></div>
      </section>

      <section class="tab-pane fade" id="requests" role="tabpanel">
        <div class="list-group list-group-flush" id="requestList"></div>
      </section>

      <section class="tab-pane fade" id="sent" role="tabpanel">
        <div class="list-group list-group-flush" id="sentList"></div>
      </section>

      <section class="tab-pane fade" id="ignored" role="tabpanel">
        <p class="small text-muted">People in this list can't send you friend requests.</p>
        <div class="list-group list-group-flush" id="ignoreList"></div>
      </section>
    </div>
    </div>
  </div>

  <!-- shown when a request is blocked -->
  <div class="modal fade" id="blockedModal" tabindex="-1" aria-labelledby="blockedTitle" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="blockedTitle">Request not sent</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body"><p class="mb-0" id="blockedText"></p></div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">OK</button></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/people.js"></script>
</body>
</html>
