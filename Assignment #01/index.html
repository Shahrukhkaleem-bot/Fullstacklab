<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | ConnecFriend</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-sm-9 col-md-6 col-lg-4">

        <div class="text-center mb-4">
          <img src="img/logo.svg" width="56" height="56" alt="ConnecFriend logo">
          <h1 class="h4 fw-bold text-success mt-2 mb-1">ConnecFriend</h1>
          <p class="text-muted small mb-0">Keep up with your friends</p>
        </div>

        <div class="card border-0 shadow-sm rounded-3">
          <div class="card-body p-4">
            <h2 class="h5 mb-3">Sign in</h2>

            <div class="alert alert-danger py-2 small d-none" id="loginError" role="alert"><span id="loginErrorText"></span></div>

            <form id="loginForm" class="needs-validation" novalidate>
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control form-control-lg" id="username" autocomplete="username" required minlength="3" pattern="[A-Za-z0-9_.]+">
                <div class="invalid-feedback">Please enter your username.</div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group has-validation">
                  <input type="password" class="form-control form-control-lg" id="password" autocomplete="current-password" required minlength="4">
                  <button class="btn btn-outline-secondary" type="button" id="togglePassword">Show</button>
                  <div class="invalid-feedback">Please enter your password.</div>
                </div>
              </div>
              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label" for="remember">Remember me</label>
              </div>
              <button type="submit" class="btn btn-success btn-lg w-100" id="loginBtn">Sign in</button>
            </form>
          </div>
        </div>

        <p class="text-center text-muted small mt-3 mb-1">Test account: <b>shahrukh</b> / <b>shahrukh123</b><br>(every user's password is their username + 123)</p>
        <p class="text-center small"><a href="#" class="link-secondary" id="resetDemo">Reset data</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
