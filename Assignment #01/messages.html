<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages | ConnecFriend</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <div id="navbar"></div>

  <div class="container py-4">
    <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
      <div class="row g-0">

        <!-- conversations -->
        <aside class="col-md-4 border-end" id="listPane">
          <div class="p-3 border-bottom">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h1 class="h5 mb-0">Messages</h1>
              <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#newModal"><i class="bi bi-pencil-square"></i> New</button>
            </div>
            <input type="search" class="form-control form-control-sm bg-body-tertiary border-0" id="convSearch" placeholder="Search conversations" aria-label="Search conversations">
          </div>
          <div class="list-group list-group-flush overflow-auto chat-scroll" id="convList"></div>
        </aside>

        <!-- chat -->
        <main class="col-md-8 d-flex flex-column bg-body" id="threadPane">
          <div class="p-3 border-bottom d-flex align-items-center gap-2" id="threadHeader"></div>
          <div class="flex-grow-1 overflow-auto p-3 bg-body-tertiary chat-scroll" id="thread" aria-live="polite"></div>
          <form class="p-3 border-top d-none" id="sendForm" novalidate>
            <div class="input-group">
              <textarea class="form-control bg-body-tertiary border-0" id="msgInput" rows="1" maxlength="1000" placeholder="Type a message" aria-label="Message"></textarea>
              <button class="btn btn-success px-4" type="submit"><i class="bi bi-send"></i> Send</button>
            </div>
            <div class="d-flex justify-content-between small mt-1">
              <span class="text-danger d-none" id="sendError"></span>
              <span class="text-muted ms-auto" id="msgCount">0 / 1000</span>
            </div>
          </form>
        </main>
      </div>
    </div>
  </div>

  <!-- new message: pick any member -->
  <div class="modal fade" id="newModal" tabindex="-1" aria-labelledby="newTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="newTitle">New message</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="small text-muted">You can message friends and other members.</p>
          <input type="search" class="form-control mb-3" id="memberSearch" placeholder="Search members" aria-label="Search members">
          <div class="list-group" id="memberList"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
