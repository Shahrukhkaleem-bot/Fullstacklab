<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · TechNest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-bg d-flex flex-column">
  <div id="navbar"></div>

  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-4">
          <div class="card border-0 shadow-lg rounded-4">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <i class="bi bi-box-arrow-in-right display-5 text-primary"></i>
                <h1 class="h3 fw-bold mt-2">Welcome back</h1>
                <p class="text-body-secondary mb-0">Log in to continue shopping.</p>
              </div>

              <div class="alert alert-info small d-none" id="loginNotice" role="status"><i class="bi bi-lock"></i> Please log in to continue to checkout.</div>
              <div class="alert alert-danger d-none" id="loginError" role="alert"></div>

              <form id="loginForm" class="needs-validation" novalidate>
                <div class="form-floating mb-3">
                  <input type="email" class="form-control" id="email" placeholder="Email" required autocomplete="email">
                  <label for="email">Email address</label>
                  <div class="invalid-feedback">Please enter your email.</div>
                </div>
                <div class="input-group mb-3 has-validation">
                  <div class="form-floating">
                    <input type="password" class="form-control" id="password" placeholder="Password" required autocomplete="current-password">
                    <label for="password">Password</label>
                  </div>
                  <button class="btn btn-outline-secondary" type="button" id="togglePass" aria-label="Show password"><i class="bi bi-eye"></i></button>
                  <div class="invalid-feedback">Please enter your password.</div>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember" checked>
                    <label class="form-check-label small" for="remember">Remember me</label>
                  </div>
                  <a href="#" class="small" data-bs-toggle="tooltip" data-bs-title="Demo store: create a new account instead.">Forgot password?</a>
                </div>
                <button class="btn btn-primary btn-lg w-100 fw-semibold" type="submit">Log in</button>
              </form>

              <div class="text-center my-3 small text-body-secondary">or</div>
              <a href="signup.html" id="signupLink" class="btn btn-outline-dark w-100">Create a new account</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    TN.renderNavbar('login');
    const next = TN.param('next') || 'index.html';
    document.getElementById('signupLink').href = 'signup.html?next=' + encodeURIComponent(next);
    if (next === 'checkout.html') document.getElementById('loginNotice').classList.remove('d-none');
    if (TN.currentUser()) location.href = next;

    document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));

    const pass = document.getElementById('password');
    document.getElementById('togglePass').addEventListener('click', e => {
      const show = pass.type === 'password';
      pass.type = show ? 'text' : 'password';
      e.currentTarget.innerHTML = show ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
    });

    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      form.classList.add('was-validated');
      if (!form.checkValidity()) return;
      const err = document.getElementById('loginError');
      try {
        await TN.login(form.email.value, pass.value);
        location.href = next;
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
